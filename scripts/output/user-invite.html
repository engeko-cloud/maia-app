<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acesso ao MAIA</title>
</head>
<body style="margin:0;background:#ffffff;font-family:Inter, system-ui, -apple-system, sans-serif;color:#0f172a;">
  <div style="max-width:600px;margin:0 auto;padding:24px;">
    <h1 style="font-size:20px;color:#1e40af;margin:0 0 8px;">MAIA · ENGEKO</h1>
    <h2 style="font-size:18px;margin:16px 0;">Acesso ao MAIA</h2>
    
    <p style="margin:16px 0;">Olá {{ .Email }}, sua conta no MAIA foi criada. Clique no botão abaixo para definir sua senha.</p>
    <div style="margin-top:16px;">
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1e40af;color:#ffffff;padding:10px 16px;border-radius:6px;text-decoration:none;">Definir senha</a>
    </div>
  
    <div style="border-top:1px solid #e2e8f0;margin-top:32px;padding-top:16px;">
      <p style="font-size:12px;color:#475569;margin:0;">Esta é uma mensagem automática. Não responda a este email.</p>
    </div>
  </div>
</body>
</html>
